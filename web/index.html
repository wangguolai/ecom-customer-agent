<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物电商客服 Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f7; display: flex; flex-direction: column; height: 100vh;
}
.header {
    background: linear-gradient(135deg, #2b5876, #4e4376); color: #fff;
    padding: 14px 20px; font-size: 1.1em; font-weight: 600; flex-shrink: 0;
}
.header small { font-weight: 400; opacity: .8; margin-left: 10px; }
.chat {
    flex: 1; overflow-y: auto; padding: 16px; max-width: 860px; width: 100%; margin: 0 auto;
}
.msg { margin-bottom: 16px; display: flex; gap: 10px; }
.msg.user { justify-content: flex-end; }
.bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; font-size: .95em;
}
.msg.user .bubble { background: #4e4376; color: #fff; border-bottom-right-radius: 3px; }
.msg.assistant .bubble { background: #fff; color: #333; border: 1px solid #e5e6e8; border-bottom-left-radius: 3px; }
.avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.1em;
}
.msg.user .avatar { background: #dfe4ea; }
.msg.assistant .avatar { background: #e8f0fe; }
.images { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.images figure { width: 140px; text-align: center; }
.images img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 10px;
    border: 1px solid #e5e6e8; cursor: zoom-in; background: #fff;
}
.images figcaption { font-size: .72em; color: #888; margin-top: 4px; line-height: 1.4; }
.product-intro { display: block; color: #4e4376; margin-top: 2px; font-size: .95em; }
/* 伪菜单：三级漏斗第一级的产品化——把口语意图翻译成规则层能命中的规范表达 */
.menu {
    flex-shrink: 0; padding: 10px 16px 0; background: #fff; border-top: 1px solid #e5e6e8;
    max-width: 860px; width: 100%; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.menu .menu-label { font-size: .78em; color: #999; margin-right: 2px; }
.menu button {
    padding: 5px 13px; background: #f2f0f8; color: #4e4376; border: 1px solid #ded8ee;
    border-radius: 999px; font-size: .82em; cursor: pointer; transition: all .15s;
    font-family: inherit;
}
.menu button:hover { background: #4e4376; color: #fff; border-color: #4e4376; }
.menu button:disabled { opacity: .45; cursor: default; }
.input-area {
    flex-shrink: 0; padding: 10px 16px 12px; background: #fff;
    display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto;
}
.input-area input {
    flex: 1; padding: 10px 14px; border: 1px solid #d0d3d8; border-radius: 8px; font-size: .95em; outline: none;
}
.input-area input:focus { border-color: #4e4376; }
.input-area button {
    padding: 10px 22px; background: #4e4376; color: #fff; border: none; border-radius: 8px;
    font-size: .95em; cursor: pointer; transition: background .2s;
}
.input-area button:hover { background: #3b3360; }
.input-area button:disabled { background: #b0aec4; cursor: default; }
/* 大图浮层 */
.lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none;
    align-items: center; justify-content: center; z-index: 999;
}
.lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>
</head>
<body>
<div class="header">🐾 宠物电商客服 Agent <small>真实商品库 · 162 款在售商品</small></div>
<div class="chat" id="chat"></div>
<div class="menu" id="menu"><span class="menu-label">快捷：</span></div>
<div class="input-area">
    <input id="msg" placeholder="问点什么：幼犬吃什么粮？有肠胃敏感的猫粮吗？" onkeydown="if(event.key==='Enter')send()">
    <button id="send-btn" onclick="send()">发送</button>
</div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" src=""></div>

<script>
const chatEl = document.getElementById('chat');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send-btn');

function addMsg(role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🙂' : '🐾';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    div.appendChild(role === 'user' ? bubble : avatar);
    div.appendChild(role === 'user' ? avatar : bubble);
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
}

function renderImages(images, container) {
    const box = document.createElement('div');
    box.className = 'images';
    for (const it of images) {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.src = '/' + it.image;
        img.alt = it.title || '';
        img.onclick = () => {
            document.getElementById('lightbox-img').src = img.src;
            document.getElementById('lightbox').style.display = 'flex';
        };
        const cap = document.createElement('figcaption');
        cap.textContent = it.title || '';
        if (it.intro) {
            const intro = document.createElement('span');
            intro.className = 'product-intro';
            intro.textContent = it.intro;
            cap.appendChild(intro);
        }
        fig.appendChild(img); fig.appendChild(cap);
        box.appendChild(fig);
    }
    container.appendChild(box);
    chatEl.scrollTop = chatEl.scrollHeight;
}

// ── 伪菜单（三级漏斗第一级的产品化）──
// text：点击后填进输入框的「规范化意图句」——规则层能命中的表达。
// arg ：是否需要用户补参数。
//       true  = 只填入并聚焦，光标停在末尾等用户补（订单号/商品名），回车才发。
//       false = 本身就是完整意图，填入后立即发送，直达规则路由（零 LLM 决策）。
// 为什么不用「点了就发、缺参数让 agent 反问」：反问补参要求跨轮记住「刚才点的是查订单」，
// 而 /chat/stream 每次请求都新建 AgentSession、前端也不传历史 —— 无状态链路上反问接不住。
// 改成前端补参数，参数不跨轮传递，规则路由 100% 命中。
const DEFAULT_PLACEHOLDER = msgEl.placeholder;
const MENU_ITEMS = [
    { label: '📦 查订单', text: '查订单 ', arg: true, tip: '补上订单号，例如：查订单 20240818001' },
    { label: '🚚 查物流', text: '查物流 ', arg: true, tip: '补上订单号，例如：查物流 20240818001' },
    { label: '🏷️ 查库存', text: '查库存 ', arg: true, tip: '补上商品名，例如：查库存 皇家幼犬粮' },
    { label: '📋 退货政策', text: '退货政策', arg: false },
    { label: '🐾 商品咨询', text: '', arg: true, tip: '说说你想了解什么，例如：幼犬吃什么粮？' },
    { label: '🙋 转人工', text: '我要转人工，我的问题是：', arg: true, tip: '接在后面描述一下问题' },
];

const menuEl = document.getElementById('menu');
const menuBtns = [];
for (const item of MENU_ITEMS) {
    const btn = document.createElement('button');
    btn.textContent = item.label;
    btn.onclick = () => pickMenu(item);
    menuEl.appendChild(btn);
    menuBtns.push(btn);
}

function pickMenu(item) {
    msgEl.placeholder = item.tip || DEFAULT_PLACEHOLDER;
    msgEl.value = item.text || '';
    msgEl.focus();
    const end = msgEl.value.length;
    msgEl.setSelectionRange(end, end);   // 光标停末尾，用户直接续写参数
    if (!item.arg) send();               // 无参意图：点了就发
}

async function send() {
    const msg = msgEl.value.trim();
    if (!msg) return;
    addMsg('user').textContent = msg;
    msgEl.value = '';
    sendBtn.disabled = true;
    menuBtns.forEach(b => b.disabled = true);
    const bubble = addMsg('assistant');

    try {
        const resp = await fetch('/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg }),
        });
        if (!resp.ok) {
            bubble.textContent = '请求失败（HTTP ' + resp.status + '），请确认后端已启动。';
            return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split('\n\n');
            buffer = events.pop();
            for (const ev of events) {
                for (const line of ev.split('\n')) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    let obj;
                    try { obj = JSON.parse(data); } catch (e) { continue; }
                    if (obj.delta) {
                        bubble.textContent += obj.delta;
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                    if (obj.images) {
                        renderImages(obj.images, bubble);
                    }
                }
            }
        }
    } catch (e) {
        bubble.textContent = '连接异常：' + e.message;
    } finally {
        sendBtn.disabled = false;
        menuBtns.forEach(b => b.disabled = false);
    }
}
</script>
</body>
</html>
