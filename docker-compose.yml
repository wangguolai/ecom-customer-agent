# -*- coding: utf-8 -*-
# 电商客服后端编排 —— mysql + redis + backend（模块 7 部署运维）
#
# 三个容器在同一个 compose 默认网络里，互相用「服务名」当 host 访问。
# 关键坑：容器内 127.0.0.1 指向容器自身，连不上别的容器——必须用服务名 mysql / redis。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}   # 外部注入，默认 root（demo 够）；不写死到镜像/代码
      MYSQL_DATABASE: ecommerce
    ports:
      # 宿主机 3307 → 容器 3306。本机已装 MySQL 占着宿主机 3306，直接映射会 bind 失败：
      #   "ports are not available: ... bind: Only one usage of each socket address"
      # 只改宿主机侧；backend 走 compose 内部网络连 mysql:3306，不经过这层映射，故 MYSQL_PORT 保持 3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # 数据持久化：容器删了订单/工单还在
    healthcheck:
      # 只等容器「启动」不够——MySQL 冷启动要几秒，期间连不上。
      # healthcheck 探到真正 ready，backend 才 depends_on 放行，否则 backend 启动 init_db 连库直接崩
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine   # RESP2 默认，配合代码 protocol=2（redis-py 8.x 默认 RESP3 会踩坑）
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 配置外部化：代码用 os.environ.get(...) 读，这里注入覆盖——代码零改动
      # 本机跑是 127.0.0.1，容器里是服务名，靠同一套 env 机制切换，不用改代码
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      # condition: service_healthy —— 等 MySQL/Redis 真 ready 再起，不是「容器起来了就算」
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
